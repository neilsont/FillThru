<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerLaunch</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 6v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V6l-8-4z" fill="#b8941f"/>
          <path d="M9 12l2 2 4-4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">CareerLaunch</span>
      </div>
      <div id="status-dot" class="status-dot offline" title="Not connected"></div>
    </header>

    <!-- Login view -->
    <div id="view-login" class="view">
      <div class="section-title">Sign in to your account</div>
      <div id="login-error" class="error-msg" style="display:none"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button id="btn-login" class="btn btn-primary">Sign in</button>
      <p class="hint">Use your CareerLaunch credentials</p>
    </div>

    <!-- Main view (logged in) -->
    <div id="view-main" class="view" style="display:none">
      <div class="profile-row">
        <div class="avatar" id="avatar-initials">–</div>
        <div>
          <div class="profile-name" id="profile-name">Loading…</div>
          <div class="profile-email" id="profile-email"></div>
        </div>
        <button id="btn-logout" class="btn-icon" title="Sign out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>

      <div class="divider"></div>

      <!-- Autofill -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">Auto-fill this page</div>
          <div id="autofill-badge" class="badge badge-idle">Ready</div>
        </div>
        <p class="hint" id="page-host">Detecting form fields…</p>
        <button id="btn-autofill" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Fill Application
        </button>
        <div id="fill-result" class="fill-result" style="display:none"></div>
      </div>

      <div class="divider"></div>

      <!-- Alerts -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">Alerts needing your attention</div>
          <div id="alert-count" class="badge badge-warn" style="display:none">0</div>
        </div>
        <div id="alerts-list" class="alerts-list">
          <p class="hint">No pending alerts</p>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Profile summary -->
      <div class="section">
        <div class="section-title">Profile</div>
        <div id="profile-summary" class="profile-summary">
          <div class="hint">Loading profile…</div>
        </div>
        <a id="open-dashboard" href="#" class="btn btn-outline" target="_blank">
          Open Dashboard ↗
        </a>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
